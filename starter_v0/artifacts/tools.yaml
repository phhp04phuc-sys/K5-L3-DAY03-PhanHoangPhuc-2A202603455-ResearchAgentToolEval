# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team new tools (Nguyen Tien Cuong) ----------------
  - name: sentiment
    description: "Phân tích cảm xúc và sắc thái (tích cực, tiêu cực, trung lập) của một đoạn văn bản hoặc bài đăng mạng xã hội. Dùng khi người dùng muốn đánh giá tâm lý, sắc thái hoặc phản ứng của dư luận về một chủ đề/sản phẩm. KHÔNG dùng để tra cứu tin tức mới."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần phân tích cảm xúc"}
        detailed: {type: boolean, default: false, description: "Có trích xuất danh sách từ khóa cảm xúc chi tiết hay không"}
      required: [text]

  - name: extract_keywords
    description: "Trích xuất danh sách từ khóa chính, hashtag (#tag), đếm số từ và ước tính thời gian đọc của một bài viết hoặc đoạn văn bản. Dùng khi người dùng muốn rút trích từ khóa, tags hoặc thống kê độ dài bài viết. KHÔNG dùng để tìm kiếm web hay phân tích cảm xúc."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đoạn văn bản hoặc nội dung bài viết cần trích xuất từ khóa"}
        top_n: {type: integer, default: 5, description: "Số lượng từ khóa nổi bật nhất muốn lấy (mặc định 5)"}
      required: [text]

  # ---------------- Team new tools (Ly Thanh Lap) ----------------
  - name: github_search
    description: "Tìm kiếm mã nguồn mở và GitHub repositories theo từ khóa. Chỉ dùng khi người dùng yêu cầu tìm repo/project trên GitHub. KHÔNG dùng cho tìm kiếm tin tức web thông thường (dùng lookup)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm GitHub repository"}
        sort: {type: string, enum: [stars, forks, updated, best-match], default: "stars", description: "Tiêu chí sắp xếp"}
        max_results: {type: integer, default: 5, description: "Số lượng repository trả về (1-10)"}
      required: [query]

  - name: hf_models
    description: "Tìm kiếm các mô hình AI/ML trên Hugging Face Hub theo từ khóa. Chỉ dùng khi người dùng yêu cầu tìm model trên Hugging Face. KHÔNG dùng cho bài báo arXiv (dùng papers) hay repo GitHub (dùng github_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc tên model trên Hugging Face"}
        sort: {type: string, enum: [downloads, likes, lastModified], default: "downloads", description: "Tiêu chí sắp xếp"}
        max_results: {type: integer, default: 5, description: "Số lượng model trả về (1-10)"}
      required: [query]

  # ---------------- Team new tools (Le Van Hoang) ----------------
  - name: citation_format
    description: "Tạo chuỗi trích dẫn chuẩn học thuật (APA, BibTeX hoặc Markdown) từ tiêu đề, URL, tác giả và năm xuất bản. Dùng khi người dùng yêu cầu tạo trích dẫn/citation hoặc tài liệu tham khảo cho bài báo/bài viết."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề bài báo hoặc tài liệu"}
        url: {type: string, default: "", description: "Đường link URL của bài viết/tài liệu"}
        author: {type: string, default: "", description: "Tên tác giả hoặc tổ chức"}
        year: {type: string, default: "", description: "Năm xuất bản"}
        style: {type: string, enum: [markdown, apa, bibtex], default: "markdown", description: "Định dạng trích dẫn (markdown, apa, bibtex)"}
      required: [title, url, style]

  - name: url_check
    description: "Kiểm tra cú pháp URL và phân loại độ tin cậy nguồn tin theo chuẩn công ty (tier_1 học thuật/chính thống, tier_2 báo chí, tier_3 mạng xã hội). Dùng khi người dùng yêu cầu kiểm tra/xác minh độ uy tín của link mà không cần cào toàn bộ nội dung (fetch)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Đường link URL cần kiểm tra và phân loại source tier"}
      required: [url]

  # ---------------- Team new tools (Luu Dang Tuan) ----------------
  - name: papers
    description: Tìm bài báo khoa học trên arXiv theo từ khoá. Dùng khi user hỏi về paper, nghiên cứu học thuật, tài liệu khoa học.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "Từ khoá tìm kiếm, ví dụ 'retrieval augmented generation'"
        max_results:
          type: integer
          description: "Số bài tối đa, từ 1 đến 20"
          default: 5
        sort_by:
          type: string
          enum: [relevance, date]
          default: relevance
      required: [query]

  - name: paper_text
    description: Tải PDF của một bài arXiv theo arXiv ID và trích xuất văn bản. Dùng khi user cần nội dung chi tiết của một bài cụ thể.
    parameters:
      type: object
      properties:
        arxiv_id:
          type: string
          description: "arXiv ID, ví dụ '2401.00001' hoặc URL arxiv.org"
        max_chars:
          type: integer
          description: "Số ký tự tối đa trả về, mặc định 8000"
          default: 8000
        page_limit:
          type: integer
          description: "Số trang đọc tối đa, mặc định 10"
          default: 10
      required: [arxiv_id]